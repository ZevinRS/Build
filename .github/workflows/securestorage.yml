# Builds the SecureStorage iOS app (Tauri) from its private repo and publishes it as a release there,
# where the AppHub tab finds it. Manual only; nothing is published here.
name: SecureStorage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: SecureStorage branch, tag, or commit
        default: main

permissions:
  contents: read

concurrency:
  group: securestorage
  cancel-in-progress: true

env:
  SOURCE_REPO: ZevinRS/SecureStorage
  BUILD_NUMBER_OFFSET: 100

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BUILD_TOKEN }}
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust iOS target
        run: rustup target add aarch64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/src-tauri/target
          key: securestorage-ios-${{ hashFiles('src/src-tauri/Cargo.lock') }}
          restore-keys: securestorage-ios-

      - name: Install dependencies
        working-directory: src
        run: |
          # not npm ci: the lockfile is written on Windows and lacks some macOS-only optional entries
          npm install --no-audit --no-fund --loglevel=error
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate iOS project
        working-directory: src
        run: |
          npx tauri icon src-tauri/icons/app-icon.svg > /dev/null
          npx tauri ios init --ci

      - name: Build (unsigned)
        working-directory: src
        run: npx tauri ios build --no-sign --ci --target aarch64

      - name: Package IPA and manifest
        run: |
          ipa=$(find src/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$ipa" || { echo "No .ipa produced"; exit 1; }
          build=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          echo "BUILD=$build" >> "$GITHUB_ENV"
          work=$(mktemp -d)
          (cd "$work" && unzip -q "$GITHUB_WORKSPACE/$ipa")
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)
          plist="$app/Info.plist"
          # Monotonic build number for the AppHub tab's update check (unsigned, so editing is safe).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
          (cd "$work" && zip -qr SecureStorage.ipa Payload)
          mv "$work/SecureStorage.ipa" SecureStorage.ipa
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          jq -n \
            --arg name "$(pb CFBundleDisplayName 2>/dev/null || pb CFBundleName)" \
            --arg bundleID "$(pb CFBundleIdentifier)" \
            --arg version "$(pb CFBundleShortVersionString)" \
            --argjson build "$build" \
            '{id: "securestorage", name: $name, bundleID: $bundleID, version: $version, build: $build}' > app.json

      - name: Publish release on the source repo
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          sha=$(git -C src rev-parse HEAD)
          tag="securestorage-$(date -u +%Y%m%d-%H%M)-${sha::7}"
          gh release create "$tag" SecureStorage.ipa app.json \
            -R "$SOURCE_REPO" \
            --target "$sha" \
            --title "SecureStorage iOS build $BUILD" \
            --notes "Install from the AppHub tab in LiveContainer."
