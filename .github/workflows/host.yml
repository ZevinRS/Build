# Builds the custom LiveContainer host from the private AppHub repo and publishes it as a release there.
# Manual only. This repo is public: no artifacts are uploaded here, and nothing private is printed.
name: Host

on:
  workflow_dispatch:
    inputs:
      ref:
        description: AppHub branch, tag, or commit
        default: main

permissions:
  contents: read

concurrency:
  group: host
  cancel-in-progress: true

env:
  SOURCE_REPO: ZevinRS/AppHub
  # Builds published from this repo are numbered from 101, above the old in-repo builds.
  BUILD_NUMBER_OFFSET: 100

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - uses: actions/checkout@v6

      - name: Check out source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BUILD_TOKEN }}
          submodules: recursive
          path: src

      - name: Archive (unsigned)
        working-directory: src/host
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -archivePath "$RUNNER_TEMP/host" \
            -sdk iphoneos -arch arm64 -configuration Release \
            -quiet

      - name: Package IPA and manifest
        run: |
          build=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          echo "BUILD=$build" >> "$GITHUB_ENV"
          APPHUB_BUILD=$build bash scripts/package-host.sh "$RUNNER_TEMP/host.xcarchive" AppHubHost.ipa
          plist="$RUNNER_TEMP/host.xcarchive/Products/Applications/LiveContainer.app/Info.plist"
          jq -n \
            --arg bundleID "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" \
            --arg version "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" \
            --argjson build "$build" \
            '{id: "host", name: "AppHub host", bundleID: $bundleID, version: $version, build: $build}' > host.json

      - name: Publish release on the source repo
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          sha=$(git -C src rev-parse HEAD)
          tag="host-$(date -u +%Y%m%d-%H%M)-${sha::7}"
          gh release create "$tag" AppHubHost.ipa host.json \
            -R "$SOURCE_REPO" \
            --target "$sha" \
            --title "Host build $BUILD" \
            --notes "Custom LiveContainer host, build $BUILD. Install: LiveContainer → AppHub tab → Host → Download, then SideStore. Choose Keep App Extensions."
